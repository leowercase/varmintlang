<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Varmint playground</title>
    <!-- Font Awesome icons  -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v7.2.0/css/all.css" crossorigin="anonymous">
    <!-- Merriweather Sans  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <!-- Website styles  -->
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./github_light_ansi_theme.css">
    <link rel="icon" href="/varproto.svg" type="image/svg" />
  </head>
  <body>
    <div id="main" data-left-width="1fr">
      <header id="header">
        <div>
          <img src="/varproto.svg" alt="Little bugger" />
          <h1 class="merriweather-sans-normal">Playground</h1>
          <menu>
            <button id="btn-run">
              <i class="fas fa-play fa-lg"></i> <span>Run</span>
            </button>
            <button id="btn-dis" class="btn">
              <i class="fas fa-magnifying-glass fa-lg"></i> <span>Disassemble</span>
            </button>
          </menu>
        </div>
      </header>
      <div id="editor" class="content code"></div>
      <div id="sep" class="content"></div>
      <div id="output" class="content code">
        <pre id="stdout" class="github-light-ansi-theme">Run to see output here!</pre>
      </div>
    </div>
    <script src="/ace-builds/src-min-noconflict/ace.js" type="text/javascript" charset="utf-8"></script>
    <script src="/ace-varmint.js" type="text/javascript" charset="utf-8"></script>
    <script src="/main.mjs" type="module" charset="utf-8"></script>
  </body>
</html>
